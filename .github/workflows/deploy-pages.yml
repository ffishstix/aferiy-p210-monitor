name: Test and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'cloud/**'
  pull_request:
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'cloud/**'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - name: Apply database schema
        run: npx wrangler d1 execute aferiy-p210-monitor --remote --file schema.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b2d0e2d5a5cbf26a2c51ae5d00d24dab
      - name: Deploy website
        run: npx wrangler pages deploy public --project-name aferiy-p210-monitor --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b2d0e2d5a5cbf26a2c51ae5d00d24dab
