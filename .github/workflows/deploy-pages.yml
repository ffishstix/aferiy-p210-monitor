name: Test and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'cloud/**'
      - 'collector/**'
      - 'worker/**'
      - 'desktop/**'
  pull_request:
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'cloud/**'
      - 'collector/**'
      - 'worker/**'
      - 'desktop/**'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test local collector
        working-directory: collector
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Test cloud collector
        working-directory: worker
        run: |
          npm ci
          npm test

  desktop:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop application
        run: dotnet build desktop/BatteryWatch.csproj -c Release
      - name: Test desktop application
        shell: pwsh
        run: |
          dotnet publish desktop/BatteryWatch.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -o desktop/smoke
          $smoke = Start-Process -FilePath (Resolve-Path desktop/smoke/BatteryWatch.exe) -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($smoke.ExitCode -ne 0) { throw 'Desktop smoke test failed' }
          $manifest = Resolve-Path cloud/public/updates/latest.json
          $verify = Start-Process -FilePath (Resolve-Path desktop/smoke/BatteryWatch.exe) -ArgumentList @('--verify-update-manifest', $manifest) -Wait -PassThru -WindowStyle Hidden
          if ($verify.ExitCode -ne 0) { throw 'Release manifest verification failed' }

  deploy:
    if: github.event_name == 'push'
    needs: [test, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - name: Apply database schema
        run: npx wrangler d1 execute aferiy-p210-monitor --remote --file schema.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b2d0e2d5a5cbf26a2c51ae5d00d24dab
      - name: Install cloud collector dependencies
        working-directory: worker
        run: npm ci
      - name: Deploy cloud collector
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b2d0e2d5a5cbf26a2c51ae5d00d24dab
      - name: Deploy website
        run: npx wrangler pages deploy public --project-name aferiy-p210-monitor --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b2d0e2d5a5cbf26a2c51ae5d00d24dab
